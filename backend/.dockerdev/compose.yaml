name: synapse-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_development
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: .dockerdev/Dockerfile.dev
    working_dir: /workspace/backend
    volumes:
      - ..:/workspace/backend
      - bundle-cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/backend_development
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/workspace/backend/bin/docker-dev-entrypoint"]
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    tty: true
    stdin_open: true

volumes:
  db-data:
  bundle-cache:
