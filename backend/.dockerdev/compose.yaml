name: synapse-backend

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_development
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_development"]
      interval: 2s
      timeout: 3s
      retries: 30

  # R2 stand-in for dev/test (AD-13, epic P2-6 ticket 01) — the api's
  # ActiveStorage :minio service (backend/config/storage.yml) targets
  # http://minio:9000 here. The data port is published (kickoff choice 3:
  # "ports 9000 only") but bound to loopback — the dev credentials are the
  # documented weak defaults, so the bucket must never leave the machine;
  # the console port stays unexposed. Caveat for the browser PUT (epic-08's
  # consumer): presigned URLs carry the CONTAINER hostname (minio:9000), so
  # a host browser needs a `127.0.0.1 minio` /etc/hosts entry (mirroring CI)
  # plus CORS on the bucket — a provisioning item on ticket 03, not code.
  # Dev creds MUST stay aligned with the dev defaults in
  # backend/config/storage.yml (backend/.env.example documents the contract;
  # production reads R2_* from real ENV with no defaults).
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: synapse-dev
      MINIO_ROOT_PASSWORD: synapse-dev-password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket init so `just up` is self-sufficient (epic P2-6 kickoff
  # choice 3): idempotent (alias + --ignore-existing), runs once per fresh
  # stack, and the api container does not start until it has completed.
  minio-init:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: synapse-dev
      MINIO_ROOT_PASSWORD: synapse-dev-password
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/synapse-materials"
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: .dockerdev/Dockerfile.dev
    working_dir: /workspace/backend
    volumes:
      - ..:/workspace/backend
      - bundle-cache:/usr/local/bundle
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/backend_development
      # Dev-only session-token signing secret (Accounts::TokenCodec, AD-15).
      # Fixed so minted tokens survive container restarts; outside dev, set a
      # real random secret (backend/.env.example documents the contract).
      JWT_SECRET: dev-only-insecure-secret-change-me
      # Demo account (db/seeds.rb, epic P2-2 ticket 03) — the seed is
      # idempotent on every db:seed; these are the documented dev defaults
      # (backend/.env.example documents the contract).
      DEMO_EMAIL: demo@synapse.test
      DEMO_PASSWORD: demo-password
    depends_on:
      db:
        condition: service_healthy
      # Storage parity (epic P2-6 ticket 01): minio healthy + the
      # synapse-materials bucket present before the api starts.
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/workspace/backend/bin/docker-dev-entrypoint"]
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    tty: true
    stdin_open: true

volumes:
  db-data:
  bundle-cache:
  minio-data:
