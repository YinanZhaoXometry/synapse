# The e2e provider stub wiring (the frontend/e2e harness). NOT loaded by
# `just up` — compose only merges extra files when the invocation lists them
# explicitly:
#
#   docker compose -f backend/.dockerdev/compose.yaml \
#     -f backend/.dockerdev/compose.e2e.yaml up -d --wait
#
# The stub (frontend/e2e/stub-provider.mjs, auto-started by Playwright's
# webServer) answers every provider call deterministically — an e2e run never
# spends a live AI call. AI_API_KEY is placeholder-forced here (last file
# wins) so Provider.configured? is true even without any local key, and
# AI_BASE_URL is what actually routes the traffic to the stub; host.docker.internal
# is the Docker-Desktop path from the api container to the host-run stub.
services:
  backend:
    # host.docker.internal is Docker-Desktop built-in; plain Linux (the ci.yml
    # e2e job's ubuntu runner) only resolves it with the host-gateway mapping.
    # Redundant-but-harmless on macOS, load-bearing on CI (epic-17 ticket 05).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_BASE_URL: http://host.docker.internal:8791
      AI_API_KEY: e2e-stub-placeholder-key
      AI_MODEL: e2e-stub
