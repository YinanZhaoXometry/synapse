# ActiveStorage service configurations (AD-13, epic P2-6 ticket 01). One shape
# per environment; the environment files select the service (no code fork):
#
#   development.rb / test.rb → :minio   production.rb → :r2
#
# minio — the compose R2 stand-in (backend/.dockerdev/compose.yaml). Endpoint
# and bucket are pinned dev parity facts; access/secret come from ENV with the
# documented dev defaults (backend/.env.example). The compose MINIO_ROOT_USER/
# MINIO_ROOT_PASSWORD MUST stay aligned with those defaults.
minio:
  service: S3
  endpoint: http://minio:9000
  bucket: synapse-materials
  access_key_id: <%= ENV.fetch("R2_ACCESS_KEY_ID", "synapse-dev") %>
  secret_access_key: <%= ENV.fetch("R2_SECRET_ACCESS_KEY", "synapse-dev-password") %>
  region: us-east-1
  # Path-style addressing: minio is reached on a bare hostname, and keeping
  # one addressing style across dev/prod keeps the presigned-URL shape
  # identical for ticket 02's flow.
  force_path_style: true

# r2 — Cloudflare R2 in production. Every value comes from ENV with NO
# defaults (plain ENV[...] — nil when missing); production.rb fails fast at
# boot when any of the four vars is absent instead of silently aiming the S3
# client somewhere wrong. Provisioning is ticket 03 (owner-side).
r2:
  service: S3
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  # R2's S3 API is region-agnostic — the SDK convention for R2 is "auto".
  region: auto
  force_path_style: true
