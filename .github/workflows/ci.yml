# CI — the gates the project already trusts, made real (AD-17, Q2=a):
# frontend: pnpm frozen install → tsc -b → eslint → vitest → vite build →
#   mastery-vector anti-drift (regenerate + stamp-insensitive diff) (from frontend/)
# backend: RuboCop → RSpec (from backend/)
# (gate sequences: keep in sync with the root justfile spec recipe and the
#  Web gates block in AGENTS.md)
#
# No repository secrets are used — the scaffold has no AI/providers (AD-12).
name: CI

on:
  push:
    branches:
      - main
      # epic/** is deliberate: the epic's AC "green run on the integration
      # branch before merge" is satisfied by pushing epic/p2-0-monorepo.
      - 'epic/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (tsc · eslint · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Full history (not the default shallow clone): the mastery-vector fixture
      # pins its source commit via `git log -1 -- <domain paths>`, which needs
      # history beyond HEAD to resolve (see the anti-drift step below).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version pinned explicitly, not read from package.json's packageManager
      # field (if the two ever disagree, this action fails loudly — that's
      # the intended guardrail).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
      # Codegen + freshness (AD-17/AD-18, epic P2-8 T1): the committed typed
      # documents are runtime-load-bearing; regenerate and fail on drift —
      # a schema change must land with regenerated output. Mirrors the
      # justfile spec recipe.
      - name: Generate GraphQL documents
        run: pnpm run codegen
      - name: Codegen freshness (regenerate + diff)
        run: git diff --exit-code -- src/types/graphql.ts
      - name: Typecheck
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm exec eslint .
      - name: Test
        run: pnpm exec vitest run --coverage
      - name: Build
        run: pnpm exec vite build

      # Dist size visibility (epic-19 T1, spec decision 5): the permanent,
      # zero-dep companion to the pinned before/after report
      # (.scratch/phase-3/epic-19-bundle-split/bundle-report.md) — every CI
      # run publishes the built asset sizes to the job summary, so bundle
      # drift is visible in the PR without a charting plugin. Mirrors the
      # coverage-summary step's shape below; shell builtins + coreutils only
      # (ls/stat/sort — the same gzip+ls method the report pins).
      - name: Dist size summary
        if: always()
        run: |
          dir=dist/assets
          if [ -d "$dir" ] && [ -n "$(ls "$dir" 2>/dev/null)" ]; then
            {
              echo "## Frontend dist assets"
              echo ""
              echo "| asset | bytes |"
              echo "| --- | --- |"
              total=0
              : > sizes.tmp
              for f in "$dir"/*; do
                size=$(stat -c%s "$f")
                total=$((total + size))
                printf '%s %s\n' "$size" "${f##*/}" >> sizes.tmp
              done
              sort -rn sizes.tmp | while read -r size name; do
                printf '| %s | %s |\n' "$name" "$size"
              done
              echo "| total | $total |"
              rm -f sizes.tmp
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend dist assets" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "dist/assets missing — did the Build step run?" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Coverage (epic P3-17 ticket 02): vitest's json-summary reporter writes
      # coverage/coverage-summary.json; publish the totals to the job summary
      # and keep the HTML report as an artifact. Thresholds (the ratchet floor)
      # land with epic-17 ticket 10 — measure first, then pin.
      - name: Coverage summary
        if: always()
        run: |
          file=coverage/coverage-summary.json
          if [ -f "$file" ]; then
            lines=$(jq -r '.total.lines.pct' "$file")
            branches=$(jq -r '.total.branches.pct' "$file")
            functions=$(jq -r '.total.functions.pct' "$file")
            {
              echo "## Frontend coverage"
              echo ""
              echo "| metric | covered |"
              echo "| --- | --- |"
              echo "| lines | ${lines}% |"
              echo "| branches | ${branches}% |"
              echo "| functions | ${functions}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "coverage/coverage-summary.json missing — did the Test step run with --coverage?" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

      # Anti-drift (AD-14): the TS domain (frontend/src/domain/mastery.ts + streak.ts)
      # is the golden-vector source of truth until the cutover retires it. Regenerate
      # the committed fixture and require a byte-identical result — a diff means the
      # pinned mastery/streak behavior moved without regenerating the contract the
      # Ruby port (backend/spec/fixtures/mastery_vectors.json, ticket 02's RSpec)
      # pins itself against. This step retires with the TS side at cutover.
      #
      # The diff is STAMP-INSENSITIVE (epic P2-4 review): meta.generatedAtSourceCommit
      # is advisory provenance, not contract — SOURCE_PATHS includes the generator and
      # fixture commits ride generator edits, so the stamp is self-referential and every
      # vector-extending commit provably lands a stale stamp (fired in practice: 7a6c4b3,
      # f69f7aa). The gate strips the stamp from BOTH the committed and the regenerated
      # fixture (temp files out of the tree) and diffs those; the stamp's format stays
      # pinned by backend/spec/lib/mastery_spec.rb.
      - name: Mastery vector anti-drift (regenerate + stamp-insensitive diff)
        run: |
          fixture=../backend/spec/fixtures/mastery_vectors.json
          snapshot="$(mktemp)"; committed="$(mktemp)"; regenerated="$(mktemp)"
          trap 'rm -f "$snapshot" "$committed" "$regenerated"' EXIT
          cp "$fixture" "$snapshot"
          jq 'del(.meta.generatedAtSourceCommit)' "$fixture" > "$committed"
          pnpm run generate:mastery-vectors
          jq 'del(.meta.generatedAtSourceCommit)' "$fixture" > "$regenerated"
          diff -u "$committed" "$regenerated"
          # The stripped forms matched: any rewrite the generator did above is
          # stamp-only (advisory) — restore the pre-regen file so the gate leaves
          # no residue in the tree.
          cmp -s "$fixture" "$snapshot" || cp "$snapshot" "$fixture"

  backend:
    name: backend (rubocop · rspec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # RSpec is DB-backed since epic P2-1 ticket 02 (2026-11-04): the spine ER
      # landed as migrations + models and model specs pin real rows. Mirror the
      # dev compose (postgres:17-alpine, postgres/postgres); backend_test
      # matches config/database.yml's test entry and the db:create db:migrate
      # below.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backend_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # database.yml defaults are dev-compose-shaped; in CI this points at the
      # service container above (localhost, mapped port).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/backend_test
    steps:
      - uses: actions/checkout@v4

      # pg compiles from source — libpq headers needed on the runner.
      - name: Install libpq-dev (pg gem native build)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      # The storage spike spec (epic P2-6 ticket 01) targets the dev-compose
      # endpoint http://minio:9000 straight from config/storage.yml; minio
      # runs as a VM process on loopback (below), so map the hostname onto it.
      - name: Point "minio" at loopback
        run: sudo sh -c 'echo "127.0.0.1 minio" >> /etc/hosts'

      # MinIO's community distribution was archived in late 2025, and the
      # pinned release is now unobtainable as an image anywhere — docker.io
      # (the whole minio/minio repo is gone), quay.io and ghcr.io (401/403),
      # dl.min.io archives (410), and the GitHub release carries no binaries.
      # The dev machine's image is a from-source build of this same tag
      # (backend/.dockerdev/compose.yaml + ticket 01's Comments); CI builds
      # the identical pinned source itself — self-contained, nothing
      # published, no extra credentials. GOTOOLCHAIN=auto fetches the
      # go.mod-pinned toolchain; the specs ensure the bucket themselves.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build minio from the pinned release source (no registry carries it)
        run: |
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z https://github.com/minio/minio.git /tmp/minio-src
          cd /tmp/minio-src
          GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o /usr/local/bin/minio .
      - name: Start minio (dev defaults, loopback only)
        run: |
          MINIO_ROOT_USER=synapse-dev MINIO_ROOT_PASSWORD=synapse-dev-password \
            nohup /usr/local/bin/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live

      # .ruby-version is read from backend/ (working-directory below).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Prepare database
        # db:create db:migrate, deliberately NOT db:prepare: db:prepare
        # auto-runs db:seed on a freshly created database (Rails behavior),
        # and this job's service container presents exactly that state on
        # every run — the demo account would be committed before the suite.
        # The backend test suite runs against an unseeded schema; this
        # guarantees that deterministically.
        run: RAILS_ENV=test bundle exec rails db:create db:migrate
      - name: Lint
        run: bundle exec rubocop
      - name: Test
        run: RAILS_ENV=test bundle exec rspec

      # Coverage (epic P3-17 ticket 01): SimpleCov starts at the top of
      # spec_helper and writes coverage/.last_run.json at exit. Publish the
      # totals to the job summary and keep the HTML report as an artifact for
      # the per-group picture (commands/graphql/models/lib/jobs/controllers).
      # The line floor lives in spec_helper (minimum_coverage) — a red coverage
      # gate is a red Test step, not a red summary.
      - name: Coverage summary
        if: always()
        run: |
          file=coverage/.last_run.json
          if [ -f "$file" ]; then
            line=$(jq -r '.result.line' "$file")
            branch=$(jq -r '.result.branch' "$file")
            {
              echo "## Backend coverage"
              echo ""
              echo "| metric | covered |"
              echo "| --- | --- |"
              echo "| line | ${line}% |"
              echo "| branch | ${branch}% |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "coverage/.last_run.json missing — SimpleCov did not run?" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # The critical-flow suite becomes a merge gate (epic P3-17 ticket 05): the
  # exact `just e2e` flow — demo stack booted with compose.e2e.yaml merged
  # (the api talks to the host-run deterministic stub provider, never live
  # AI), Chromium installed, 15 specs, report+traces uploaded on failure.
  # Runs only on otherwise-green pushes (`needs`), since it is by far the
  # slowest job (dev-image build + bundle install + serial suite).
  e2e:
    name: e2e (playwright critical flows over the stub provider)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      # The api CONTAINER reaches the host-run stub via the host-gateway
      # bridge on Linux, so the stub must listen on all interfaces in CI
      # (locally it stays loopback-only; playwright.config passes the env
      # through to the stub's webServer).
      E2E_PROVIDER_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      # Presigned upload URLs carry the minio:9000 hostname — the e2e browser
      # (Chromium on the runner) resolves it here, mirroring the backend job
      # and the documented dev prerequisite.
      - name: Point "minio" at loopback
        run: sudo sh -c 'echo "127.0.0.1 minio" >> /etc/hosts'

      # compose.yaml pins minio/minio:RELEASE.2025-10-15T17-29-55Z — and the
      # grave is deeper than the backend job's: that release's OWN Dockerfile
      # bases `FROM minio/minio:latest` (the same dead repo), so even a plain
      # source docker-build cannot resolve (first CI run proved it). Build the
      # pinned server binary from source (the backend job's provenance) plus
      # the mc client the minio-init one-shot needs, into a minimal runtime
      # image that also carries curl (the compose healthcheck) — the tag is
      # what compose expects.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build the pinned minio image from source binaries (no registry, no upstream Dockerfile)
        run: |
          git clone --depth 1 --branch RELEASE.2025-10-15T17-29-55Z https://github.com/minio/minio.git /tmp/minio-src
          git clone --depth 1 https://github.com/minio/mc.git /tmp/mc-src
          # go build runs from INSIDE each module — building an external path
          # from a non-module cwd fails ("cannot find main module").
          cd /tmp/minio-src && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o /tmp/minio-bin/minio .
          cd /tmp/mc-src && GOTOOLCHAIN=auto CGO_ENABLED=0 go build -o /tmp/minio-bin/mc .
          printf '%s\n' \
            'FROM ubuntu:24.04' \
            'RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*' \
            'COPY minio /usr/bin/minio' \
            'COPY mc /usr/bin/mc' \
            'RUN chmod +x /usr/bin/minio /usr/bin/mc' \
            'EXPOSE 9000' \
            'ENTRYPOINT ["/usr/bin/minio"]' \
            | docker build -t minio/minio:RELEASE.2025-10-15T17-29-55Z -f - /tmp/minio-bin

      # The `just e2e` boot, step for step: demo stack + compose.e2e.yaml
      # (compose merges only listed files — deploy.md §1). Playwright's
      # webServer starts the stub provider and the Vite dev server itself
      # (reuseExistingServer: !CI keeps local reuse; CI always starts fresh).
      - name: Boot the demo stack with the stub provider wired in
        run: |
          files="-f backend/.dockerdev/compose.yaml"
          [ -f backend/.dockerdev/compose.override.yaml ] && files="$files -f backend/.dockerdev/compose.override.yaml"
          docker compose $files -f backend/.dockerdev/compose.e2e.yaml up -d --wait

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the critical-flow suite
        run: pnpm exec playwright test
        working-directory: frontend

      - name: Upload e2e report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
