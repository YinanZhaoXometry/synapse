# Quiz session + evidence operations (epic P2-8 T1). Question generation stays
# client-side and deterministic in T1 (createQuizSession accepts the generated
# questions); the AI-generation mutations ride ticket 05's seam swap. Grading
# results move scores SERVER-side through recordEvidence (AD-14: no local
# recompute — surfaces refetch plan/task reads after it).

query QuizSession($id: String!) {
  quizSession(id: $id) {
    ...QuizSessionParts
  }
}

mutation CreateQuizSession($input: CreateSessionInput!) {
  createQuizSession(input: $input) {
    session {
      id
      planId
      taskId
      mode
      status
      createdAt
      completedAt
    }
    questions {
      ...QuestionParts
    }
  }
}

mutation AbandonQuizSession($input: AbandonSessionInput!) {
  abandonQuizSession(input: $input) {
    session {
      id
      status
    }
  }
}

mutation RecordEvidence($input: RecordEvidenceInput!) {
  recordEvidence(input: $input) {
    evidence {
      id
      nodeId
      sessionId
      questionId
      outcome
      createdAt
    }
    mistakes {
      id
      questionId
      sessionId
      nodeId
      userAnswer
      sourceLocation {
        kind
        page
        sectionId
      }
      forfeited
      createdAt
    }
    # The targeted live update (epic P2-10 T3, FR-6): the touched nodes ride
    # with their FRESH server masteryScore/state and the owning plan with its
    # fresh rollup — Apollo normalizes both by id, so every score-rendering
    # surface (plan node rows, the rollup ring, task rings, the plans list)
    # updates live WITHOUT refetching any plan. The evidence/streak sweeps in
    # useRecordEvidenceMutation carry the non-node data (marks, streak).
    nodes {
      ...KnowledgeNodeParts
    }
    plan {
      id
      masteryScore
    }
    session {
      ...QuizSessionParts
    }
  }
}
