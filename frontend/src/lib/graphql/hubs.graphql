# The hub read-model reads (epic P2-09). T1 landed the api-side aggregation
# (backend Hubs module — the scoped queries); these are the web's typed reads
# over it, added per surface ticket. mistakesHub (T2, FR-23) answers the FLAT
# newest-first list — grouping, filtering, and title resolution off the ids
# are the web's rendering concerns, decided here. todayHub + the manual-task
# ops (T3, FR-27): the 今日学习 assembly read plus the writes T1 deferred —
# due-item link targets, manual rows, the suggestion slot, and the summary
# counts ride the wire verbatim; the client renders, never re-aggregates.
# flashcardDecksHub + quizHistoryHub + retakeQuizSession (T4, FR-41/42): the
# deck aggregation + the full quiz history, and the one schema movement — the
# hub retake. The retake is a FRESH server-side generation (the api mints the
# new session's uuid); the web navigates the new session's flow route.
# analyticsSeries + weeklyGoal + setWeeklyGoal + badgeState (T5, FR-26/25):
# the three analytics series (node mastery / weekly accuracy / 14-day
# consistency — every score and count server-computed, AD-14), the weekly-goal
# read (sessions, never minutes — SM-C3) the dashboard ring consumes, its
# plain setter (last write wins, 1..21), and the badge states' raw slice for
# the dashboard's recent-unlocked summary (the full page is T6's).
# setMistakeEntryResolved (epic-18 T4, spec decision 4): the mistake
# lifecycle's single-boolean setter — user-marked, toggles BOTH ways; the
# server's replay answer is the state comparison (a same-state toggle returns
# unchanged), so the client uuid rides per AD-12 as the shape-checked
# idempotency key.

query AnalyticsSeries {
  analyticsSeries {
    nodeMastery {
      nodeId
      nodeTitle
      planId
      masteryScore
      state
    }
    weeklyAccuracy {
      weekStart
      correct
      answered
    }
    consistency {
      day
      sessionCount
    }
  }
}

query WeeklyGoal {
  weeklyGoal {
    target
    currentWeekSessions
    currentWeekStart
  }
}

query BadgeStates {
  badgeState {
    id
    unlocked
    counter
    threshold
  }
}

mutation SetWeeklyGoal($input: SetWeeklyGoalInput!) {
  setWeeklyGoal(input: $input) {
    weeklyGoal {
      target
      currentWeekSessions
      currentWeekStart
    }
  }
}

query FlashcardDecksHub {
  flashcardDecksHub {
    materialId
    materialTitle
    planId
    planTitle
    taskId
    cardCount
    createdAt
  }
}

query QuizHistoryHub {
  quizHistoryHub {
    sessionId
    planId
    planTitle
    taskId
    mode
    createdAt
    questionCount
    scoreSummary {
      correct
      total
    }
  }
}

mutation RetakeQuizSession($input: RetakeSessionInput!) {
  retakeQuizSession(input: $input) {
    session {
      id
      status
      mode
      planId
      taskId
    }
  }
}

query MistakesHub {
  mistakesHub {
    id
    questionId
    sessionId
    nodeId
    planId
    taskId
    materialId
    userAnswer
    sourceLocation {
      kind
      page
      sectionId
    }
    forfeited
    resolved
    createdAt
    question {
      prompt
      kind
      options
    }
  }
}

mutation SetMistakeEntryResolved($input: SetMistakeEntryResolvedInput!) {
  setMistakeEntryResolved(input: $input) {
    mistakeEntry {
      id
      resolved
    }
  }
}

query TodayHub {
  todayHub {
    due {
      itemType
      itemId
      dueAt
      stage
      title
      nodeId
      planId
      taskId
      materialId
      questionId
      sourceLocation {
        kind
        page
        sectionId
      }
    }
    suggestions {
      planId
      planTitle
      nodeId
      nodeTitle
    }
    manual {
      id
      title
      dueDate
      done
      createdAt
      updatedAt
    }
    summary {
      dueCount
      manualCount
      doneCount
    }
  }
}

# The week strip's data source (FR-27): the read model has no per-day
# evidence calendar — consistency (the last 14 UTC days, zeros included)
# is the honest source, mapped onto the current Mon–Sun UTC week client-side.
query TodayConsistency {
  analyticsSeries {
    consistency {
      day
      sessionCount
    }
  }
}

mutation AddManualTask($input: AddManualTaskInput!) {
  addManualTask(input: $input) {
    manualTask {
      id
      title
      dueDate
      done
      createdAt
      updatedAt
    }
  }
}

mutation SetManualTaskDone($input: SetManualTaskDoneInput!) {
  setManualTaskDone(input: $input) {
    manualTask {
      id
      title
      dueDate
      done
      createdAt
      updatedAt
    }
  }
}

mutation DeleteManualTask($input: DeleteManualTaskInput!) {
  deleteManualTask(input: $input) {
    deletedManualTaskId
  }
}
