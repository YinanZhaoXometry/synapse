# Material↔node mapping operations (epic P2-10 T1, FR-45). The per-material
# coverage read + the three mutations: the AI map run and the user's bulk
# confirm/reject verdicts on proposed rows.

fragment MaterialNodeMappingParts on MaterialNodeMapping {
  id
  materialId
  nodeId
  sectionId
  proposedNodeTitle
  status
  createdAt
}

query MaterialNodeMappings($materialId: String!) {
  materialNodeMappings(materialId: $materialId) {
    ...MaterialNodeMappingParts
  }
}

# The node side (epic P2-10 T3): the node click-through's confirmed-mapping
# read — every status rides (the wire's one mapping list vocabulary); the
# consumer filters confirmed for the jump targets.
query NodeMaterialMappings($nodeId: String!) {
  materialNodeMappings(nodeId: $nodeId) {
    ...MaterialNodeMappingParts
  }
}

mutation MapMaterialSections($input: MapMaterialSectionsInput!) {
  mapMaterialSections(input: $input) {
    mappings {
      ...MaterialNodeMappingParts
    }
  }
}

mutation ConfirmMappingProposals($input: ConfirmMappingProposalsInput!) {
  confirmMappingProposals(input: $input) {
    mappings {
      ...MaterialNodeMappingParts
    }
  }
}

mutation RejectMappingProposals($input: RejectMappingProposalsInput!) {
  rejectMappingProposals(input: $input) {
    mappings {
      ...MaterialNodeMappingParts
    }
  }
}
