# Study Task operations (epic P2-8 T1). A task owns exactly one auto-created
# node (AD-6) — read off the task, never re-derived client-side. The
# promotion pointer fields (epic-14 T2, FR-37 stretch): promotedPlanId
# non-null ⇔ the task is the read-only pointer to that plan; promotedPlan
# rides along so the pointer card can name the plan without a second read.

query Tasks {
  tasks {
    id
    materialId
    nodeId
    createdAt
    promotedPlanId
    promotedAt
    promotedPlan {
      id
      topic
    }
    node {
      ...KnowledgeNodeParts
    }
  }
}

query Task($id: String!) {
  task(id: $id) {
    id
    materialId
    nodeId
    createdAt
    promotedPlanId
    promotedAt
    promotedPlan {
      id
      topic
    }
    node {
      ...KnowledgeNodeParts
    }
  }
}

mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    task {
      id
      materialId
      nodeId
      createdAt
    }
    node {
      ...KnowledgeNodeParts
    }
  }
}

mutation PromoteTaskToPlan($input: PromoteTaskToPlanInput!) {
  promoteTaskToPlan(input: $input) {
    plan {
      id
      topic
    }
    task {
      id
      promotedPlanId
      promotedAt
      promotedPlan {
        id
        topic
      }
    }
  }
}
